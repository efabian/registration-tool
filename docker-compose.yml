# FIX C-1: All secrets are now loaded from a .env file (gitignored) via env_file.
# Copy .env.example to .env and fill in real values before running.
# Never commit .env to source control.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.db  # must contain POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env  # contains DATABASE_URL, SMTP_*, EMAIL_*, ADMIN_PASSCODE, PING_SALT, ZOOM_*

volumes:
  pgdata:
